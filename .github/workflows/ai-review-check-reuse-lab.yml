# Sandbox only: existing github-actions review is a fixture, not real AI completion.
name: AI Review Check Reuse Lab
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write
jobs:
  verify:
    if: ${{ vars.AI_REVIEW_SANDBOX == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ai-review-disposition-${{ github.repository }}-6
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        repository: IS-Model-Framework/.github
        ref: 850c68a5a448433b8aa5041408053e541b60cef9
        path: .ci-shared
        persist-credentials: false
        sparse-checkout: scripts
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Verify one ID through success, progress, cleanup failure and restored policy
      env:
        GH_TOKEN: ${{ github.token }}
        CONFIGURED_BOTS: ${{ vars.AI_REVIEW_BOTS }}
        AI_REVIEW_CHECKS_FILE: ${{ runner.temp }}/ai-review-checks.jsonl
      run: |
        python - <<'PY'
        import json
        import os
        import sys
        sys.path.insert(0, '.ci-shared')
        from scripts import check_ai_review_disposition as c

        repo, number = os.environ['GITHUB_REPOSITORY'], 6
        api = c.GitHub(os.environ['GH_TOKEN'])
        import time
        original_request = api.request
        def trace(method, path, body=None):
            response = original_request(method, path, body)
            if '/check-runs/' in path and '?filter=' not in path:
                print('CHECK API', method, path.rsplit('/', 1)[-1], json.dumps({key: response.get(key) for key in ['id', 'status', 'conclusion', 'external_id', 'completed_at']}), flush=True)
            return response
        api.request = trace
        pr = api.request('GET', f'/repos/{repo}/pulls/{number}')
        assert pr['state'] == 'open' and pr['head']['ref'] == 'test/ai-review-e2e-shared-reviewed'
        head = pr['head']['sha']
        path = f'/repos/{repo}/commits/{head}/check-runs?filter=all'
        before = api.pages(path, 'check_runs')
        gate = [x for x in before if x['name'] == c.CHECK_NAME and x['external_id'].startswith(f'ai-review-disposition:{number}:')]
        assert len(gate) == 1
        check_id = gate[0]['id']
        protected = {x['id']: x for x in before if x['id'] != check_id}
        states = []
        configured = {x.strip().lower() for x in os.environ['CONFIGURED_BOTS'].split(',') if x.strip()}
        assert configured and configured != {'github-actions[bot]'}

        def observe(status, conclusion):
            for attempt in range(10):
                check = api.request('GET', f'/repos/{repo}/check-runs/{check_id}')
                if (check['status'], check['conclusion']) == (status, conclusion):
                    break
                time.sleep(1)
            assert (check['status'], check['conclusion']) == (status, conclusion), (check['status'], check['conclusion'])
            states.append({'id': check_id, 'status': status, 'conclusion': conclusion})

        try:
            assert c.check_pr(api, repo, number, {'github-actions[bot]'})
            time.sleep(2)
            observe('completed', 'success')
            from urllib.error import HTTPError
            for reset in [{'status': 'in_progress', 'completed_at': None}, {'status': 'queued'}]:
                try:
                    probe = api.request('PATCH', f'/repos/{repo}/check-runs/{check_id}', reset)
                    print('Reset probe:', reset, json.dumps({key: probe.get(key) for key in ['id', 'status', 'conclusion', 'completed_at']}))
                except HTTPError as error:
                    print('Reset rejected:', reset, error.code, error.read().decode())
            repository_id = api.request('GET', f'/repos/{repo}')['node_id']
            probe = api.request('POST', '/graphql', {'query': 'mutation($input: UpdateCheckRunInput!) { updateCheckRun(input: $input) { checkRun { id status conclusion completedAt } } }', 'variables': {'input': {'checkRunId': gate[0]['node_id'], 'repositoryId': repository_id, 'status': 'IN_PROGRESS', 'conclusion': None, 'completedAt': None}}})
            print('GraphQL reset:', json.dumps(probe))
            observe('in_progress', None)
            check = c.register_check(api, repo, number, head)
            assert check['id'] == check_id
            observe('in_progress', None)
            assert c.finish_pending(api, repo, number, head, c.generation())
            observe('completed', 'failure')
            assert c.check_pr(api, repo, number, {'github-actions[bot]'})
            time.sleep(2)
            observe('completed', 'success')
        finally:
            restored = c.check_pr(api, repo, number, configured)
        assert not restored, 'Fixture PR should still lack configured real bot completion'
        observe('completed', 'failure')
        after = api.pages(path, 'check_runs')
        assert {x['id'] for x in after} == {x['id'] for x in before}
        assert {x['id']: x for x in after if x['id'] != check_id} == protected
        report = json.dumps({'head': head, 'checks_before': len(before), 'checks_after': len(after), 'states': states}, indent=2)
        print(report)
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
            stream.write('\nSandbox fixture transitions; original real-bot policy restored.\n```json\n' + report + '\n```\n')
        PY
    - name: Close unfinished lab registration
      if: ${{ always() && hashFiles('.ci-shared/scripts/check_ai_review_disposition.py') != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
        AI_REVIEW_CHECKS_FILE: ${{ runner.temp }}/ai-review-checks.jsonl
      run: python3 .ci-shared/scripts/check_ai_review_disposition.py --cleanup-file "$AI_REVIEW_CHECKS_FILE"
